[project]
name = "milvus-rag-api"
version = "1.0.0"
description = "Reusable Milvus RAG Template with 2-Stage Retrieval, Cross-Encoder Reranking and RAG Triad Evaluation"
authors = [{ name = "AI Engineering Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pymilvus>=2.4.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=2.6.0",
    "numpy>=1.26.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
