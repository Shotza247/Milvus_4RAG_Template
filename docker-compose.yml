version: '3.8'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - milvus-net

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "3000:3000"
    depends_on:
      - "standalone"
    networks:
      - milvus-net

  rag-api:
    container_name: milvus-rag-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      MINIO_ENDPOINT: minio:9000
      ETCD_ENDPOINTS: etcd:2379
      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL_NAME: all-MiniLM-L6-v2
      RERANKER_PROVIDER: cross-encoder
      RERANKER_MODEL_NAME: BAAI/bge-reranker-base
    volumes:
      - ./data:/app/data
      - ./volumes/model_cache:/root/.cache
    ports:
      - "8000:8000"
    depends_on:
      - "standalone"
    networks:
      - milvus-net

  streamlit-ui:
    container_name: milvus-streamlit-ui
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8502", "--server.address=0.0.0.0"]
    environment:
      API_BASE_URL: http://rag-api:8000
    ports:
      - "8502:8502"
    volumes:
      - ./data:/app/data
      - ./streamlit_app.py:/app/streamlit_app.py
    depends_on:
      - "rag-api"
    networks:
      - milvus-net

networks:
  milvus-net:
    driver: bridge
